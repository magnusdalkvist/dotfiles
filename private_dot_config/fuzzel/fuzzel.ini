# fuzzel — fallback launcher on Super+D
#
# vicinae on Super+Space is the primary launcher. fuzzel exists for the case
# where vicinae is not running (or you are debugging it) and for its dmenu mode,
# which shell scripts can pipe into. Colours are RRGGBBAA.

font=RobotoMono Nerd Font:size=12
dpi-aware=no
prompt="  "
icon-theme=Yaru
icons-enabled=yes
terminal=foot -e
layer=overlay
lines=12
width=45
tabs=4
inner-pad=12
horizontal-pad=20
vertical-pad=16
line-height=24

[colors]
background=1e1e1ef2
text=dedddaff
match=d56199ff
selection=2c2c2cff
selection-text=ffffffff
selection-match=d56199ff
border=d56199ff

[border]
width=2
radius=12

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+g Control+c
