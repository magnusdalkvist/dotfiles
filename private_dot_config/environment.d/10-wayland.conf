# Wayland environment for the systemd user session.
#
# Why here rather than in the sway config: sway has no way to export variables
# to its children, and GDM does not source ~/.profile for Wayland sessions.
# systemd's environment.d is read by the user manager, so these reach every
# user service -- including vicinae.service. Since vicinae is how you launch
# most apps, they inherit these too, which is the path that actually matters.
#
# If you ever start sway from a bare TTY instead of GDM, source these from
# ~/.profile as well.

# --- Electron: Slack, VS Code, Obsidian ---------------------------------------
# Electron 28+ honours this and switches to native Wayland. Under XWayland these
# apps have blurry rendering on scaled outputs and noticeably worse trackpad
# scrolling. "auto" falls back to X11 if Wayland is unavailable, so it is safe
# to set unconditionally.
ELECTRON_OZONE_PLATFORM_HINT=auto

# --- Qt: vicinae ---------------------------------------------------------------
# Ordered list, so if the Wayland plugin ever fails to load, Qt silently falls
# back to xcb rather than the app refusing to start. Important here because
# vicinae is your launcher -- a hard failure would leave you without one.
QT_QPA_PLATFORM=wayland;xcb
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
QT_AUTO_SCREEN_SCALE_FACTOR=1

# --- Firefox -------------------------------------------------------------------
MOZ_ENABLE_WAYLAND=1

# --- Misc toolkits -------------------------------------------------------------
SDL_VIDEODRIVER=wayland
CLUTTER_BACKEND=wayland
# Java apps (JetBrains IDEs, older Swing tools) draw floating windows in the
# wrong place under tiling WMs without this.
_JAVA_AWT_WM_NONREPARENTING=1

# --- Cursor --------------------------------------------------------------------
# sway does not read the GTK cursor setting, so the theme has to be stated.
XCURSOR_THEME=Yaru
XCURSOR_SIZE=24
