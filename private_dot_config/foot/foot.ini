# foot — Wayland-native terminal
#
# Palette is the Adwaita/Yaru dark set so it sits naturally next to your GTK
# apps, with magenta remapped to the pink accent used by sway and waybar.

font=RobotoMono Nerd Font:size=11
font-bold=RobotoMono Nerd Font:weight=bold:size=11
line-height=17
dpi-aware=no

# Breathing room around the text. Matches the 8px sway gaps so a tiled terminal
# does not look cramped against the border.
pad=10x8
initial-window-size-chars=110x30
resize-by-cells=no

selection-target=clipboard
box-drawings-uses-font-glyphs=no

[scrollback]
# Generous history; foot allocates this rounded up to a power of two, on top of
# the visible lines. 10k costs a few MB.
lines=10000
indicator-position=relative
indicator-format=line

[bell]
urgent=yes
notify=no

[cursor]
style=beam
beam-thickness=1.5
blink=no

[mouse]
hide-when-typing=yes

[colors]
alpha=1.0
background=1e1e1e
foreground=deddda

# Pink block behind the cell, dark glyph on top. Lives here rather than under
# [cursor], where the option is deprecated.
cursor=1e1e1e d56199

selection-background=45414a
selection-foreground=ffffff

urls=62a0ea

# normal / dim
regular0=2c2c2c
regular1=e01b24
regular2=33d17a
regular3=f5c211
regular4=3584e4
regular5=d56199
regular6=33c7de
regular7=deddda

# bright
bright0=5e5c64
bright1=f66151
bright2=8ff0a4
bright3=f9f06b
bright4=62a0ea
bright5=eb8ec4
bright6=5bc8e0
bright7=ffffff

[key-bindings]
# Ctrl+Space is the tmux prefix, so nothing here may claim it.
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
search-start=Control+Shift+f
# Control+Shift+u is foot's unicode-input; URL mode belongs on +o.
show-urls-launch=Control+Shift+o

[search-bindings]
find-prev=Control+p
find-next=Control+n
