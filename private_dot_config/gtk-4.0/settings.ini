# GTK4 appearance for the sway session.
#
# libadwaita apps take light/dark from the settings portal, which already
# reports prefer-dark from gsettings, so this file mainly covers plain GTK4 apps
# that are not libadwaita and would otherwise default to light.

# Deliberately NO gtk-application-prefer-dark-theme here. libadwaita rejects it
# with "Using GtkSettings:gtk-application-prefer-dark-theme with libadwaita is
# unsupported. Please use AdwStyleManager:color-scheme instead." on every launch.
# Dark mode for these apps already arrives correctly through the settings
# portal, which reports prefer-dark from gsettings, so setting it here only
# bought a warning.

[Settings]
gtk-cursor-theme-name=Yaru
gtk-cursor-theme-size=24
gtk-font-name=Ubuntu Sans 11
gtk-hint-font-metrics=1
