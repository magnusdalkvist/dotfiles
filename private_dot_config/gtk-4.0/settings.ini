# GTK4 appearance for the sway session.
#
# libadwaita apps take light/dark from the settings portal, which already
# reports prefer-dark from gsettings, so this file mainly covers plain GTK4 apps
# that are not libadwaita and would otherwise default to light.

[Settings]
gtk-cursor-theme-name=Yaru
gtk-cursor-theme-size=24
gtk-font-name=Ubuntu Sans 11
gtk-application-prefer-dark-theme=1
gtk-hint-font-metrics=1
