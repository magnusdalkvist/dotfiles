# GTK3 appearance for the sway session.
#
# Under GNOME these values come from gsettings via GNOME Shell. sway runs no
# XSettings daemon, so GTK3 falls back to this file. Without it, apps that do
# not consult the settings portal render in the default light Adwaita theme --
# which on this desktop means a light app on a light wallpaper.
#
# GTK4/libadwaita apps ignore gtk-theme-name and take their light/dark cue from
# the settings portal instead; that already reports prefer-dark from gsettings,
# so they need nothing here.

[Settings]
gtk-theme-name=Yaru-magenta-dark
gtk-icon-theme-name=Yaru-magenta
gtk-cursor-theme-name=Yaru
gtk-cursor-theme-size=24
gtk-font-name=Ubuntu Sans 11
gtk-application-prefer-dark-theme=1
gtk-enable-animations=true
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
