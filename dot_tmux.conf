# Change prefix from ctrl+b to ctrl+space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Navigate panes with ctrl+shift+arrow (no prefix needed)
bind -n C-S-Left  select-pane -L
bind -n C-S-Right select-pane -R
bind -n C-S-Up    select-pane -U
bind -n C-S-Down  select-pane -D

# Split panes with prefix + arrow (arrow points to where the new pane opens)
unbind '"'
unbind %
bind Right split-window -h -c "#{pane_current_path}"
bind Down split-window -v -c "#{pane_current_path}"
bind Left split-window -h -b -c "#{pane_current_path}"
bind Up split-window -v -b -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# Clock colour (prefix + t)
set -g clock-mode-colour "#FF5073"

# Pane borders — all grey, active pane label in pink
set -g pane-active-border-style fg="#545454"
set -g pane-border-style fg="#545454"
set -g pane-border-status top
# Show a custom @label if the pane has one (set by tmux-start), else the command.
set -g pane-border-format "#{?pane_active,#[fg=#FF5073] #P · #{?#{@label},#{@label},#{pane_current_command}} ,#[fg=#888888] #P · #{?#{@label},#{@label},#{pane_current_command}} }"

# Status bar — live CPU/GPU/temps for this laptop on the left, the mada dev box
# on the right (see tmux-sysbar; it only reports mada when an ssh ControlMaster
# is already open, so the bar can never keep that instance awake). The window
# list is blanked because this setup is a grid of panes, not windows.
# Two rows: a hairline rule on top so the bar reads as its own region rather
# than blending into the bottom pane, then the metrics. Row 0 is the upper one.
# Row 1 is spelled out by hand instead of reusing the default status-format,
# which is a 2KB window-list template this setup has no use for.
set -g status on
set -g status 2
set -g status-position bottom
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=default,fg=#888888"
set -g status-left-length 120
set -g status-right-length 120
set -g status-left " #(tmux-sysbar left #{client_width})"
set -g status-right "#(tmux-sysbar right #{client_width}) "
set -g status-format[0] "#(tmux-sysbar rule #{client_width} '#{session_name}' #{window_index})"
# This is tmux's own default row template with the window-list loop cut out. The
# `list=on` middle section looks redundant but is load-bearing: it's what makes
# tmux treat left and right as separate regions and clip them. A plain
# align=left/align=right pair instead lets the two halves overwrite each other
# on a narrow client (seen at 100 columns: "5565 rpm% cpu").
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# Vi copy mode + clipboard (pbcopy on macOS, xclip on Linux)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
if-shell "uname | grep -q Darwin" {
    bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
} {
    bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel "xclip -selection clipboard"
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard"
}

# Rename the CURRENT PANE's label (shown at the top of the pane border) with
# prefix+R. The grid is panes, not windows, so the top label is the @label pane
# option (falls back to the running command when empty). Submit an empty value
# to clear it and fall back to the command name.
bind R command-prompt -p "pane label:" -I "#{@label}" "set -p @label '%%'"

# Put the left/right divider back to 50/50 after widening one side, without
# disturbing row heights. Super+= does the same thing via a GNOME shortcut (the
# terminal never forwards Super to tmux); this binding is what works inside an
# ssh'd tmux or any other terminal.
bind = run-shell "tmux-even '#{session_name}:#{window_index}'"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Create a new session — a menu to pick a plain local grid or an --ssh grid on
# the dev box (the ssh option runs in a popup because its fzf picker needs a
# TTY). Rename a session the normal tmux way with prefix+$. Also reachable from
# the "+ new session" button at the end of the overview's session list.
bind N display-menu -x C -y C -T " New session " \
    "Local grid" l "run-shell -b tmux-start" \
    "SSH grid"   s "display-popup -E -w 60% -h 70% 'tmux-start --ssh'"

# Kill the current session from anywhere — including ssh panes, where the
# tmux-kill script can't help (it runs in the remote shell, not the local tmux).
# The prefix is processed by the local server, so this always hits the right one.
bind X confirm-before -p "kill session '#S'? (y/n)" kill-session

# Switch to next session instead of detaching when a session is destroyed
set -g detach-on-destroy off
